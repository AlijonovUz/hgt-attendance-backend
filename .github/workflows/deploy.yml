name: Deploy HGT Attendance Backend

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /var/www/backend/hgt-attendance-backend
            
            echo "1. Kodni yangilash (Production)"
            git fetch origin production
            git reset --hard origin/production
            
            echo "2. Kutubxonalarni yangilash"
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            echo "3. Migratsiya va Statika"
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            
            echo "4. Servislarni qayta yoqish"
            systemctl restart hgt-attendance-backend_web
            systemctl restart hgt-attendance-backend_daphne
            systemctl restart hgt-attendance-backend_worker
            systemctl restart hgt-attendance-backend_beat
            
            systemctl reload nginx
            
            echo "Muvaffaqiyatli yakunlandi!"