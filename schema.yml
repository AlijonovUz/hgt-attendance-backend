openapi: 3.0.3
info:
  title: HGT-Attendance API
  version: 1.0.0
paths:
  /api/v1/attendance/attendance/:
    get:
      operationId: v1_attendance_attendance_list
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date-time
      - in: query
        name: date_to
        schema:
          type: string
          format: date-time
      - in: query
        name: event_type
        schema:
          type: string
          title: Hodisa turi
          enum:
          - check_in
          - check_out
          - lunch_end
          - lunch_start
        description: |-
          * `check_in` - Kelish
          * `lunch_start` - Tushlikka chiqish
          * `lunch_end` - Tushlikdan qaytish
          * `check_out` - Ketish
      - in: query
        name: face_verify
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: string
          format: uuid
      - in: query
        name: user__branch
        schema:
          type: string
          format: uuid
      - in: query
        name: user__department
        schema:
          type: string
          format: uuid
      tags:
      - Davomat (Attendance)
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttendanceListList'
          description: ''
    post:
      operationId: v1_attendance_attendance_create
      tags:
      - Davomat (Attendance)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttendanceCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttendanceCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceCreate'
          description: ''
