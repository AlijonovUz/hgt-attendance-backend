components:
  schemas:
    ActionEnum:
      enum:
      - create
      - update
      - delete
      type: string
      description: |-
        * `create` - Yaratildi
        * `update` - Yangilandi
        * `delete` - O'chirildi
    AttendanceCreate:
      type: object
      properties:
        event_type:
          allOf:
          - $ref: '#/components/schemas/EventTypeEnum'
          title: Hodisa turi
        gps_latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
          title: Kenglik (Latitude)
        gps_longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
          title: Uzunlik (Longitude)
        image:
          type: string
          format: uri
          writeOnly: true
          title: Yuzni tekshirish uchun rasm
      required:
      - event_type
      - image
    AttendanceList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
          writeOnly: true
          title: Xodim
        user_info:
          allOf:
          - $ref: '#/components/schemas/UserShortInfo'
          readOnly: true
        event_type:
          allOf:
          - $ref: '#/components/schemas/EventTypeEnum'
          title: Hodisa turi
        gps_latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
          title: Kenglik (Latitude)
        gps_longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
          title: Uzunlik (Longitude)
        face_verify:
          type: boolean
          title: Face ID tasdiqlandi
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Yaratilgan vaqti
      required:
      - created_at
      - event_type
      - id
      - user
      - user_info
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
          nullable: true
          title: Foydalanuvchi
        user_full_name:
          type: string
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          title: Harakat turi
        action_display:
          type: string
          readOnly: true
        table_name:
          type: string
          title: Jadval (Model) nomi
          maxLength: 100
        record_id:
          type: string
          title: Yozuv ID
          maxLength: 255
        object_name:
          type: string
          nullable: true
          title: Obyekt nomi
          maxLength: 255
        old_values:
          nullable: true
          title: Eski qiymatlar
        new_values:
          nullable: true
          title: Yangi qiymatlar
        ip_address:
          type: string
          nullable: true
          title: IP Manzil
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - action_display
      - created_at
      - id
      - record_id
      - table_name
      - user_full_name
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          title: Filial nomi
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Yaratilgan vaqti
      required:
      - created_at
      - id
      - name
    ChangePassword:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
          minLength: 8
        confirm_new_password:
          type: string
          writeOnly: true
      required:
      - confirm_new_password
      - new_password
      - old_password
    CustomTokenObtainPair:
      type: object
      properties:
        full_name:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - full_name
      - password
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          title: Bo'lim nomi
          maxLength: 255
        branch_info:
          allOf:
          - $ref: '#/components/schemas/Branch'
          readOnly: true
        branch:
          type: string
          format: uuid
          writeOnly: true
          title: Filial
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Yaratilgan vaqti
      required:
      - branch
      - branch_info
      - created_at
      - id
      - name
    DepartmentShort:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          title: Bo'lim nomi
          maxLength: 255
      required:
      - id
      - name
    DeviceTypeEnum:
      enum:
      - ios
      - android
      - web
      type: string
      description: |-
        * `ios` - iOS
        * `android` - Android
        * `web` - Web
    EventTypeEnum:
      enum:
      - check_in
      - lunch_start
      - lunch_end
      - check_out
      type: string
      description: |-
        * `check_in` - Kelish
        * `lunch_start` - Tushlikka chiqish
        * `lunch_end` - Tushlikdan qaytish
        * `check_out` - Ketish
    FaceVerification:
      type: object
      properties:
        image:
          type: string
          format: uri
          title: Selfie rasm
      required:
      - image
    Geozone:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Yaratilgan vaqti
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Yangilangan vaqti
        name:
          type: string
          title: Geozona nomi
          maxLength: 255
        zone_type:
          allOf:
          - $ref: '#/components/schemas/ZoneTypeEnum'
          title: Geozona turi
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          title: Kenglik (Latitude)
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          title: Uzunlik (Longitude)
        radius:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Radius (metr)
        branch:
          type: string
          format: uuid
          nullable: true
          title: Filial
      required:
      - created_at
      - id
      - latitude
      - longitude
      - name
      - updated_at
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          title: Sarlavha
          maxLength: 255
        message:
          type: string
          title: Xabar matni
        extra_data:
          nullable: true
          title: Qo'shimcha ma'lumot
        is_read:
          type: boolean
          title: O'qilganmi?
        created_at:
